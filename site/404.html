<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>404 — Страница не найдена</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; text-align: center; }
        .card { background: #1e293b; border-radius: 8px; padding: 40px; max-width: 500px; margin: 40px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { color: #f43f5e; font-size: 3em; margin: 0; }
        p { color: #94a3b8; font-size: 1.2em; }
        a { display: inline-block; margin-top: 20px; color: #38bdf8; text-decoration: none; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 4px; }
        a:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>
    <div class="card">
        <h1>404</h1>
        <h2>Страница не найдена</h2>
        <p>Запрошенный ресурс отсутствует на сервере devops.local.</p>
        <a href="/">Вернуться на главную</a>
    </div>
</body>
</html>
